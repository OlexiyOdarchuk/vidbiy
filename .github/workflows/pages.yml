name: Website

on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/build_web.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Та сама збірка, що й локально: версія коміту в адресах файлів (див. scripts/build_web.py).
      - name: Build site
        run: python3 scripts/build_web.py --version "${GITHUB_SHA::8}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - id: deployment
        uses: actions/deploy-pages@v4
